org.gradle.logging.stacktrace = all

# Decompilation and the RFG asset pipeline are memory-hungry; 3G matches the other
# Mica Technologies 1.12.2 mods and is what CI is sized for.
org.gradle.jvmargs = -Xmx3G

enableJUnit = true

# Disable the GTCEu buildscript's configuration-time "is a newer build.gradle
# available?" check. It fetches raw.githubusercontent.com during project evaluation,
# which timed out and hard-failed CI on the sibling mods (SocketTimeoutException at
# build.gradle:1454). We deliberately don't want the auto-update anyway — it would
# overwrite build.gradle and wipe the local edits listed below.
#
# DO NOT refresh the buildscript by running `gradle updateBuildScript`. That task does
# not merge: it downloads master's build.gradle and settings.gradle straight over ours,
# so it silently reverts every local edit. build.gradle is NOT pristine upstream — it was
# taken from the sibling LDIB repo and carries two deliberate changes:
#   1. the RetroFuturaGradle plugin pin, held at 1.4.7 where upstream master is on 1.4.0;
#   2. a NOTE above the lwjgl3ify dependency recording why the 1.12.2-specific
#      twilightflower port is used and why the GTNH mainline one crashes here.
#
# To refresh it safely, three-way merge instead of overwriting. Find the upstream commit
# whose build.gradle carries our `//version:` line (that is our base), then:
#   git merge-file build.gradle <base>/build.gradle <upstream-master>/build.gradle
# and confirm afterwards that the merged file differs from upstream master by exactly the
# two edits above and nothing else.
#
# settings.gradle is byte-identical to upstream master, so it has nothing to lose; the
# customisations in addon.gradle are never at risk, as that file is not one of the two
# updateBuildScript replaces.
#
# (systemProp.* is read by the script's Boolean.getBoolean('DISABLE_BUILDSCRIPT_UPDATE_CHECK') guard.)
systemProp.DISABLE_BUILDSCRIPT_UPDATE_CHECK = true

# SUM release the casino compiles against. Resolved from SUM's GitHub Releases via the Ivy repo in
# repositories.gradle. Only the slim `-api` jar is used, and only at compile time — LBE runs fine
# without SUM installed at all.
sumVersion = 2026.08.12
